<style>
  :root{--bg:#efefe1;--panel:rgba(36,5,158,.09);--ink:#111111;--muted:#4f4d44;--accent:#24059E;color-scheme:light;box-sizing:border-box}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:0;gap:0;min-height:100vh}
  h1{font-size:1.3rem;margin:4px 0 0}
  .hero{position:relative;width:100%;background:#24059E;padding:calc(100px + env(safe-area-inset-top,0px)) 10px 52px;display:flex;justify-content:center}
  .hero .hand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;width:72px;height:auto}
  h1.logo{width:100%;max-width:1100px;margin:0}
  .foot{margin-top:auto;width:100%;background:#24059E;color:#ffffff;display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.85rem}
  .wrap{margin-bottom:28px}
  .foot img{width:64px;height:auto}
  .foot b{letter-spacing:.06em}
  h1.logo img{width:100%;height:auto;display:block}
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;padding:18px 16px 0}
  label{font-size:.85rem;color:var(--muted)}
  input[type=text]{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:2px solid #24059E;background:#ffffff;color:var(--ink)}
  input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  html,body{max-width:100%;overflow-x:hidden}
  .slots{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .slot{display:block;width:100%;min-width:0;overflow:hidden;background:var(--panel);border:2px solid transparent;border-radius:12px;padding:8px;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
  .slot.active{border-color:var(--accent)}
  .slot b{font-size:.9rem}
  .thumb{position:relative;width:100%;height:0;padding-top:75%;border-radius:8px;background:rgba(36,5,158,.14);margin-top:6px;overflow:hidden}
  .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;max-width:none;object-fit:cover;display:block}
  .thumb .ph{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;color:var(--muted);font-size:.8rem}
  .stage{position:relative;width:100%;height:0;padding-top:75%;background:#000;border-radius:14px;overflow:hidden}
  video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;transform:none}
  .flash{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  .flash.on{opacity:.85;transition:none}
  .ask{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:#e4dffa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
  .ask[hidden]{display:none}
  .ask p{margin:0;font-size:.9rem;color:var(--ink)}
  .ask{overflow:auto}
  .ask .btn:not(.main){background:#ffffff;color:#24059E;border:2px solid #24059E}
  .wrapbtn{position:relative;display:inline-block}
  .nat{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
  #snapWrap .nat{pointer-events:none}
  #snapWrap.native .nat{pointer-events:auto}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{font:inherit;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;background:var(--panel);color:var(--ink)}
  .main{background:#24059E;color:#ffffff;font-weight:700;padding:14px 28px}
  button:disabled{opacity:.45;cursor:not-allowed}
  #status{min-height:1.3em;color:var(--muted);font-size:.9rem;text-align:center}
  h2{font-size:1.1rem;margin:8px 0 0}
  #folders{display:flex;flex-direction:column;gap:10px}
  .folder{background:var(--panel);border-radius:12px;padding:12px}
  .folder summary{cursor:pointer;font-weight:700;font-size:1rem;padding:2px 0}
  .folder[open] summary{margin-bottom:10px}
  .fig{margin:0;display:flex;flex-direction:column;gap:4px}
  .fig figcaption{font-size:.75rem;color:var(--muted);word-break:break-all}
  #folders{padding-left:12px;border-left:4px solid #24059E}
  .fimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fimgs img{width:100%;max-width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
  .fbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .fbtns button{font:inherit;font-size:.8rem;background:#24059E;color:#ffffff;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
  select{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid #24059E;background:#fff;color:var(--ink)}
  @supports not (aspect-ratio:1/1){.fimgs img{height:130px}}
  html{-webkit-text-size-adjust:100%}
  button,.slot{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .empty,.note{color:var(--muted);font-size:.85rem;text-align:center;margin:0}
</style>
</head>

    <button class="slot active" id="slot0" type="button"><b>1. Signature on paper</b><div class="thumb" id="thumb0"><span class="ph">Not taken yet</span></div></button>
    <button class="slot" id="slot1" type="button"><b>2. Photo with signature</b><div class="thumb" id="thumb1"><span class="ph">Not taken yet</span></div></button>
  </div>

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="flash" id="flash"></div>
    <div class="ask" id="ask">
      <p id="askMsg">Tap "Use camera" to take photos here, or "Choose file(s)" to pick photos from your gallery or files.</p>
      <span class="wrapbtn"><button class="btn" type="button">Choose file(s)</button><input type="file" class="nat" accept="image/*" multiple aria-label="Choose photos from your gallery or files"></span>
      <button class="btn main" id="allow" type="button">Use camera</button>
    </div>
  </div>
  <input type="file" id="native" accept="image/*" capture="environment" hidden>

  <div class="row">
    <span class="wrapbtn" id="snapWrap"><button class="btn main" id="snap">Take photo 1</button><input type="file" class="nat" accept="image/*" capture="environment" aria-label="Take photo with your phone camera"></span>
    <button class="btn" id="flip" disabled>Switch camera</button>
    <button class="btn" id="mirror" type="button">Flip image: off</button>
  </div>
  <div class="row"><span class="wrapbtn"><button class="btn" type="button">Choose file(s) from my phone</button><input type="file" class="nat" accept="image/*" multiple aria-label="Choose photos from your gallery or files"></span></div>
  <div class="row" id="modeRow" hidden><label for="mode">How to save:</label>
    <select id="mode"><option value="share">Choose where (Files, Drive…)</option><option value="dl">Download to my phone</option></select></div>
  <div class="row"><button class="btn main" id="save" disabled>Save folder</button></div>
  <div class="row"><button class="btn" id="changeDir" type="button" hidden>Change save folder</button></div>
  <p class="note" id="pickNote"></p>

  <div id="status">Tap "Use camera" or "Choose file(s)".</div>
  <h2>📁 Photos Taken</h2>
  <div id="folders"><p class="empty">No folders yet. Saved folders will show here with their names.</p></div>
</div>
<footer class="foot"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAE0AAABDCAYAAADZA4jAAAADSElEQVR42u3bT4iVVRjH8c/r6C3TESGjFm0CJSKKSJCCooLCTQTRooTIRSJREPRn00JxI0UFCm2iFi2CNoZFFBRSEeIiggwEiUqpFk2mMtbUjDPO3NviPpeOQzm3AaeXzvODF97znve9nPu9z3PO8zznvU2v15P6d1qWCBJaQktoCS2hpRJaQktoCS2hpRLaRdbyFo9tNR5DF69jIqEtrBdxGzpYj8cT2sK6GY9gJfamew6nDk5jFKtyIRheXfTiSGgLaEUsBL9iDFdgbUJbeOWcw+84g8kAl9AuoFUBaqAzbZp/2wrtUswU7XHMJrQL6xJMF+3pee0MOUKjuD8m/KtwruibiDntZLSn0tL6egObAt72CDcG+gXv43Mcxq60tL6uiQxgCnfH6jlQD9/jriIXfQ1H8CG+rdXSxrAxAB2f54JT2IezsUB8iTsiNHkHW2qF9k3x5T+b1/c29hftW7ADL+BBPBtuXR20a/FunH8XVjTQF+GeZQVkX1jlbDx7BK9Ggl8NtHX4Mcb0R2QD/6TDRT76DN7EDTiF52qC9hPWBIzxIZP0y/AzngjIe2Kuqwbap9gcsE4MGYtNYmdRDbkuwpNqoH2Ae4sMYOsiPuNJHKgJ2rFwseuj3V1EnHdrhCBV5Z5v4dFFPrs1soaTF3uQTcteH10ZqdJLsSIOq9X4CvfhaG2WNoWHsTvcbVhtj3Dl6FIMsmnpi8rbIv98aIh710fw+wA+qRnaaCThB3EIP0TsNoNGv0g52KXaFtc311jlKLUm4BzCBtyDKyOYndXfcDkRIEfC0tQObVMEu3sHHlH09Yp2gxvx9FIOrq3u+TGuxkdhRccj0p/w115BB5fjJryM26NSUi20/bgzVvcVYV3TYVlz0e5Ef1npOLUUg2vrxsrXRVZwtgAm5rDlAet5/YLkbNynZmjjxfhG4lgWR1PMbQfDdZuwyKoXgiZAdeddK88bvBcgZ5y/p1AltN8C2twQcHtx37naoR0LIN3Cqnp/A0wAO20J90LbOqcdwCv6VdnJsKIS2lxcH4t886mM087XSGQCneJHntavvXX/iwE1+c/i/497JrSElkpoCS2hJbSEltBSCS2hJbSEltBSCS2htVF/AlAQzcgKZseNAAAAAElFTkSuQmCC" alt="" width="77" height="67"><b>DAPAT 1SA LANG</b><span>End political dynasties.</span><span style="opacity:.6;font-size:.7rem">Version 11</span></footer>
<canvas id="canvas" hidden></canvas>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), statusEl = $('status');
const snap = $('snap'), flip = $('flip'), save = $('save'), folderInput = $('folder');
let stream = null, facing = 'environment', active = 0, folderNo = 1;
let shots = [null, null];                 // {blob, thumb}
const used = new Set();

window.addEventListener('error', e => { statusEl.textContent = 'Problem: ' + (e.message || 'unknown error'); });

// ---------- Slots & previews ----------
function setActive(i) {
  active = i;
  [0, 1].forEach(n => $('slot' + n).classList.toggle('active', n === i));
  snap.textContent = (shots[i] ? 'Retake photo ' : 'Take photo ') + (i + 1);
}
function render() {
  [0, 1].forEach(n => {
    const t = $('thumb' + n);
    t.textContent = '';
    if (shots[n]) { const img = new Image(); img.alt = 'Photo ' + (n + 1); img.onerror = () => { t.textContent = ''; const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = 'Photo taken ✓'; t.appendChild(ph); }; img.src = shots[n].thumb; t.appendChild(img); }
    else { const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = 'Not taken yet'; t.appendChild(ph); }
  });
  save.disabled = !(shots[0] && shots[1]);
  setActive(active);
}
[0, 1].forEach(n => $('slot' + n).addEventListener('click', () => setActive(n)));

function saveDraft() { dbPut({ id: 'draft', name: folderInput.value, shots, active }); }
function setShot(blob, thumb, ext) {
  shots[active] = { blob, thumb, ext: ext || 'jpg' };
  active = active === 0 && !shots[1] ? 1 : active;
  render();
  saveDraft();
  statusEl.textContent = shots[0] && shots[1]
    ? 'Both photos taken. Check the name, then tap "Save folder".'
    : 'Now take the photo with the signature.';
}
function fallbackFile(file) {   // use the original photo as-is if resizing fails on this phone
  const fr = new FileReader();
  fr.onload = () => setShot(file, fr.result);
  fr.onerror = () => { statusEl.textContent = 'Could not read that photo. Try again.'; };
  fr.readAsDataURL(file);
}
function commit(cnv, file) {     // canvas -> full JPEG for saving + small preview for the screen
  let thumb = null;
  try {
    const w = Math.min(480, cnv.width), h = Math.round(cnv.height * w / cnv.width);
    const t = document.createElement('canvas'); t.width = w; t.height = h;
    t.getContext('2d').drawImage(cnv, 0, 0, w, h);
    thumb = t.toDataURL('image/jpeg', 0.8);
  } catch (e) {}
  cnv.toBlob(b => {
    if (b && thumb) return setShot(b, thumb);
    if (file) return fallbackFile(file);
    statusEl.textContent = 'Could not capture the photo. Try again.';
  }, 'image/jpeg', 0.92);
}

// ---------- Live camera ----------
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('snapWrap').classList.remove('live');
  const msg = m => { $('snapWrap').classList.add('native'); $('askMsg').textContent = 'Tap "Use camera" to try again, or "Choose file(s)" to pick photos from your gallery or files.'; $('ask').hidden = false; $('allow').textContent = 'Use camera'; statusEl.textContent = m; };
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return msg('The camera is not available in this view. Tap "Choose file(s)" to pick your photos instead.');
  const attempts = [
    { video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: { ideal: facing } }, audio: false },
    { video: true, audio: false }
  ];
  let err = null;
  for (const c of attempts) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(c);
      video.srcObject = stream; await video.play().catch(() => {});
      flip.disabled = false; $('ask').hidden = true; $('snapWrap').classList.add('live'); $('snapWrap').classList.remove('native');
      statusEl.textContent = 'Ready. Photograph the signature on paper first.';
      return;
    } catch (e) { err = e; if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) break; }   // blocked: no point retrying
  }
  const hints = {
    NotAllowedError: 'Camera access is blocked. To allow it: in Chrome tap the lock icon by the address, then Permissions > Camera > Allow. In Safari tap aA > Website Settings > Camera > Allow. Then tap "Use camera".',
    NotReadableError: 'Another app is using the camera. Close it, or tap "Choose file(s)".',
    NotFoundError: 'No camera found. Tap "Choose file(s)" to pick your photos.'
  };
  msg(hints[err && err.name] || 'The camera could not start. Tap "Choose file(s)" to pick your photos.');
}
$('allow').addEventListener('click', () => { statusEl.textContent = 'Waiting for camera permission…'; startCamera(); });
// Mirror control: never mirrored by default. If a device sends an already-mirrored image, tap to flip preview AND photo together.
let flipX = false;
try { flipX = localStorage.getItem('flipX') === '1'; } catch (e) {}
function applyFlip() {
  video.style.transform = flipX ? 'scaleX(-1)' : 'none';
  $('mirror').textContent = 'Flip image: ' + (flipX ? 'on' : 'off');
}
$('mirror').addEventListener('click', () => {
  flipX = !flipX; try { localStorage.setItem('flipX', flipX ? '1' : '0'); } catch (e) {}
  applyFlip();
});
applyFlip();
flip.addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); });

function takeLive() {
  if (!video.videoWidth) { statusEl.textContent = 'The camera is not showing yet. Opening your phone camera instead.'; openNative(); return; }
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const cx = canvas.getContext('2d');
  cx.setTransform(1, 0, 0, 1, 0, 0);
  if (flipX) { cx.translate(canvas.width, 0); cx.scale(-1, 1); }
  cx.drawImage(video, 0, 0);
  cx.setTransform(1, 0, 0, 1, 0, 0);
  $('flash').classList.add('on'); setTimeout(() => $('flash').classList.remove('on'), 60);
  commit(canvas);
}

// ---------- Phone camera app (works when live camera is blocked) ----------
const nativeCam = $('native');
function openNative() { nativeCam.value = ''; nativeCam.click(); }
const loadImg = url => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
const readBuf = f => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsArrayBuffer(f); });
async function addFile(file) {
  statusEl.textContent = `Photo received (${(file.size / 1048576).toFixed(1)} MB). Reading it…`;
  // Copy the photo into memory first: some phones delete the temporary file as soon as the picker closes
  let mem;
  try { mem = new Blob([await readBuf(file)], { type: file.type || 'image/jpeg' }); }
  catch (e) { statusEl.textContent = 'Could not read that photo from your phone. Try again, or use "Choose file(s)".'; return; }
  const ext = ({ 'image/png': 'png', 'image/webp': 'webp', 'image/heic': 'heic', 'image/heif': 'heif' })[mem.type] || 'jpg';
  const idx = active, url = URL.createObjectURL(mem);
  setShot(mem, url, ext);                        // the picture appears in its box right away
  try {                                          // then swap in a small preview that survives a reload
    const img = await loadImg(url);
    const w = Math.min(480, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
    const t = document.createElement('canvas'); t.width = w; t.height = h;
    t.getContext('2d').drawImage(img, 0, 0, w, h);
    const d = t.toDataURL('image/jpeg', 0.8);
    if (shots[idx] && shots[idx].blob === mem) { shots[idx].thumb = d; render(); saveDraft(); }
  } catch (e) { /* keep the instant preview */ }
}
async function onPick(ev) {
  const all = Array.from(ev.target.files || []);
  const files = all.filter(f => !f.type || f.type.startsWith('image/'));
  if (!files.length) { if (all.length) statusEl.textContent = 'Please choose a photo (an image file).'; return; }
  const use = files.slice(0, 2);
  if (use.length > 1) active = 0;                // two files: first one is the signature, second the photo with it
  for (const f of use) await addFile(f);
  if (files.length > 2) statusEl.textContent = 'Only the first 2 photos were used. ' + statusEl.textContent;
}
document.querySelectorAll('input[type=file]').forEach(i => {
  i.addEventListener('change', onPick);
  i.addEventListener('click', () => { i.value = ''; });   // so the same photo name can be picked again
});
snap.addEventListener('click', () => { if (stream) takeLive(); else { statusEl.textContent = 'Allow the camera when your browser asks.'; startCamera(); } });

// ---------- Saving ----------
function cleanName(s) {
  s = s.replace(/[\\/:*?"<>|]+/g, '-').trim().replace(/\.+$/, '') || 'Folder ' + folderNo;
  let name = s, k = 2;
  while (used.has(name.toLowerCase())) name = `${s} (${k++})`;
  return name;
}
async function saveOne(f) {
  let dl = null;
  try { dl = window.claude && claude.use ? await claude.use('downloads') : null; } catch (e) {}
  if (dl) { await dl.save({ filename: f.base, data: f.blob }); return; }   // asks the viewer to confirm
  const url = URL.createObjectURL(f.blob), a = document.createElement('a');
  a.href = url; a.download = f.base; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  await new Promise(r => setTimeout(r, 1200));
}

// ---------- Save where YOU choose ----------
// Computer (Chrome/Edge): pick any folder. Phone: the share/save menu (Save to Files, Drive, etc.). Otherwise: Downloads.
const hasDir = 'showDirectoryPicker' in window;
const hasShare = (() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'a.jpg', { type: 'image/jpeg' })] })); } catch (e) { return false; } })();
let dirHandle = null;                        // remembered save folder (kept in IndexedDB)
function updatePickNote() {
  $('changeDir').hidden = !(hasDir && dirHandle);
  $('pickNote').textContent = hasDir
  ? (dirHandle
      ? `Saving into "${dirHandle.name}". You won't be asked again. Tap "Change save folder" to pick a different one.`
      : 'The first time you tap Save folder, you choose a folder. It is remembered after that.')
  : hasShare
    ? 'When you tap Save folder, your phone asks where to save. Pick "Save to Files" (or your Files app) and choose any folder.'
    : 'Your browser saves photos to its Downloads folder. To choose the folder each time on Android Chrome: Settings > Downloads > turn on "Ask where to save files". Your folders are also kept below in "Photos Taken".';
}
updatePickNote();

if (hasShare && !hasDir) $('modeRow').hidden = false;
async function getSaveDir(forcePick) {
  if (dirHandle && !forcePick) {
    let perm = await dirHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') perm = await dirHandle.requestPermission({ mode: 'readwrite' });   // one-tap re-allow after a reload
    if (perm === 'granted') return dirHandle;
  }
  const h = await window.showDirectoryPicker({ mode: 'readwrite' });
  dirHandle = h; dbPut({ id: 'dirhandle', handle: h }); updatePickNote();
  return h;
}
$('changeDir').addEventListener('click', async () => {
  try { const h = await getSaveDir(true); statusEl.textContent = `Save folder set to "${h.name}".`; }
  catch (e) { /* cancelled */ }
});
async function saveToDevice(rec) {          // must run straight from a tap
  if (hasDir) {
    try {
      const write = async root => {
        const sub = await root.getDirectoryHandle(rec.name, { create: true });
        for (const p of rec.photos) {
          const w = await (await sub.getFileHandle(p.base, { create: true })).createWritable();
          await w.write(p.blob); await w.close();
        }
        return `Saved in "${root.name}" / ${rec.name}.`;
      };
      try { return await write(await getSaveDir(false)); }
      catch (e) {
        if (e.name === 'AbortError') throw e;
        if (!dirHandle) throw e;
        // remembered folder was moved/deleted or permission refused: forget it and ask once
        dirHandle = null; dbDel('dirhandle'); updatePickNote();
        return await write(await getSaveDir(true));
      }
    } catch (e) { if (e.name === 'AbortError') throw e; }
  }
  if (hasShare && $('mode').value === 'share') {
    const files = rec.photos.map(p => new File([p.blob], p.base, { type: p.blob.type || 'image/jpeg' }));
    try { await navigator.share({ files, title: rec.name }); return `Sent ${rec.photos[0].base} and ${rec.photos[1].base} to your phone's save menu.`; }
    catch (e) { if (e.name === 'AbortError') throw e; }
  }
  for (const p of rec.photos) await saveOne(p);
  return `Saved ${rec.photos[0].base} and ${rec.photos[1].base} to your Downloads.`;
}

// ---------- "Photos Taken" list (kept in this browser, survives reloads) ----------
let db = null;
const idb = fn => new Promise(res => { if (!db) return res(fn === 'all' ? [] : undefined); try { fn(res); } catch (e) { res([]); } });
const openDB = () => new Promise(res => {
  try {
    const r = indexedDB.open('photos-taken', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('folders', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => res(null);
  } catch (e) { res(null); }
});
const dbPut = rec => idb(done => { const tx = db.transaction('folders', 'readwrite'); tx.objectStore('folders').put(rec); tx.oncomplete = tx.onerror = () => done(); });
const dbDel = id => idb(done => { const tx = db.transaction('folders', 'readwrite'); tx.objectStore('folders').delete(id); tx.oncomplete = tx.onerror = () => done(); });
const dbAll = () => idb(done => { const r = db.transaction('folders').objectStore('folders').getAll(); r.onsuccess = () => done(r.result); r.onerror = () => done([]); });

function addCard(rec, atTop) {
  const box = $('folders');
  const empty = box.querySelector('.empty'); if (empty) empty.remove();
  const d = document.createElement('details'); d.className = 'folder'; if (atTop) d.open = true;
  const sm = document.createElement('summary');
  sm.textContent = `📁 ${rec.name} (${rec.photos.length} photos)`;
  d.appendChild(sm);
  const imgs = document.createElement('div'); imgs.className = 'fimgs';
  rec.photos.forEach(p => {
    const f = document.createElement('figure'); f.className = 'fig';
    const i = new Image(); i.src = p.thumb; i.alt = p.base;
    const c = document.createElement('figcaption'); c.textContent = p.base;
    f.append(i, c); imgs.appendChild(f);
  });
  d.appendChild(imgs);
  const btns = document.createElement('div'); btns.className = 'fbtns';
  const mk = (text, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = text; b.addEventListener('click', fn); btns.appendChild(b); };
  mk('Save this folder again', () => saveToDevice(rec).then(m => { statusEl.textContent = m; }).catch(() => { statusEl.textContent = 'Save was cancelled.'; }));
  mk('Remove from list', async () => {
    await dbDel(rec.id); used.delete(rec.name.toLowerCase()); d.remove();
    if (!box.children.length) box.innerHTML = '<p class="empty">No folders yet. Saved folders will show here with their names.</p>';
  });
  d.appendChild(btns);
  atTop ? box.prepend(d) : box.appendChild(d);
}

async function saveFolder() {
  save.disabled = true;
  const name = cleanName(folderInput.value);
  const rec = { id: String(Date.now()), name, photos: shots.map((s, i) => ({ base: `${name}_${i + 1}.${s.ext || 'jpg'}`, blob: s.blob, thumb: s.thumb })) };
  used.add(name.toLowerCase());
  addCard(rec, true);
  dbPut(rec);                                  // not awaited, so the phone still sees this as a tap
  let msg;
  try { msg = await saveToDevice(rec); }
  catch (e) { msg = `"${name}" is in the list below, but saving to the device was cancelled. Tap "Save this folder again".`; }
  dbDel('draft');
  shots = [null, null]; active = 0; folderNo++;
  folderInput.value = 'Folder ' + folderNo;
  render();
  statusEl.textContent = msg + ' Ready for the next folder.';
}
save.addEventListener('click', saveFolder);

folderInput.addEventListener('input', () => { if (shots[0] || shots[1]) saveDraft(); });
render();
openDB().then(async d => {
  db = d;
  const all = (await dbAll()) || [];
  const draft = all.find(r => r.id === 'draft');
  const dh = all.find(r => r.id === 'dirhandle');
  if (dh && dh.handle) { dirHandle = dh.handle; updatePickNote(); }
  const recs = all.filter(r => r.id !== 'draft' && r.id !== 'dirhandle').sort((x, y) => Number(y.id) - Number(x.id));
  if (draft && draft.shots && (draft.shots[0] || draft.shots[1])) {
    shots = draft.shots; active = draft.active || 0;
    shots.forEach(sh => { if (sh && String(sh.thumb).startsWith('blob:')) sh.thumb = URL.createObjectURL(sh.blob); });
    render();
    statusEl.textContent = 'Your photos from before were restored.';
  }
  recs.forEach(r => { used.add(r.name.toLowerCase()); addCard(r, false); });
  folderNo = recs.length + 1; folderInput.value = (draft && draft.name) || 'Folder ' + folderNo;
});
// Ask for the camera as soon as the page opens: the browser shows its "Allow camera?" prompt
statusEl.textContent = 'Allow the camera when your browser asks.';
startCamera();
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: 'camera' }).then(p => {
    p.onchange = () => { if (p.state === 'granted' && !stream) startCamera(); };
  }).catch(() => {});
}
</script>
</body>
</html>
